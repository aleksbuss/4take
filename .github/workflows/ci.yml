name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        # `evals/corpus` is excluded in pyproject: it is deliberately defective code.
        run: uvx ruff@0.16.6 check src tests evals

      - name: Format
        run: uvx ruff@0.16.6 format --check src tests

  commit-messages:
    runs-on: ubuntu-latest
    # Conventional Commits are claimed in CONTRIBUTING.md; enforce them rather than claim them.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check commit messages
        run: |
          uvx --from commitizen cz check \
            --rev-range origin/${{ github.base_ref }}..HEAD

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # requires-python is >=3.10 and the classifiers advertise 3.10-3.13; test all of them
        # rather than only the floor.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The floor and the newest on the other two systems people install it on: a user on a
        # Mac or on Windows runs this code too, and nothing else in CI ever started on either.
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      # A broken wheel is only discovered at publish time otherwise.
      - name: Verify the CLI runs from the built wheel without the MCP extra
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/4take --version
          # The MCP entry point must fail with guidance, not an ImportError traceback.
          if /tmp/verify/bin/4take-mcp 2>/tmp/mcp.err; then
            echo "expected 4take-mcp to exit non-zero without the extra"; exit 1
          fi
          grep -q "4take\[mcp\]" /tmp/mcp.err

      # uv.lock pins mcp 1.28.1, so the test job cannot notice a newer release that removes what
      # the server imports (mcp 2.0 renamed FastMCP). Installing the wheel with its extra
      # resolves fresh, the way `pip install '4take[mcp]'` does.
      - name: Verify the MCP extra resolves to a version the server can import
        run: |
          VIRTUAL_ENV=/tmp/verify uv pip install "$(ls dist/*.whl)[mcp]"
          /tmp/verify/bin/python -c "import fourtake.mcp_server"
